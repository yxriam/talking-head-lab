<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facebook · 教学素材库</title>
<style>
:root{color-scheme:light;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#142239;background:#f3f6fb;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#112746;color:white;padding:26px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}header b{font-size:22px;letter-spacing:.5px}.badge{border:1px solid #6080a9;border-radius:30px;padding:7px 13px;font-size:14px;white-space:nowrap}main{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:32px;margin:0 0 10px}p{line-height:1.7}.muted{color:#536780}form{display:flex;gap:12px;margin:24px 0 14px}input{flex:1;min-width:0;background:white;border:1px solid #a6b6ca;border-radius:10px;padding:15px;font:inherit}button{border:0;background:#1761da;color:white;padding:13px 23px;border-radius:10px;font:inherit;cursor:pointer}button:hover{background:#114fb6}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e79320;outline-offset:3px}.examples{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px}.examples button{background:#e4edfa;color:#153c75;font-size:14px;padding:8px 12px}.notice{background:#e8eef6;border-left:3px solid #728caf;padding:14px 18px;line-height:1.7;font-size:14px}.result-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:32px}.result-head h2{margin-bottom:4px}a{color:#185dbe;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:white;border:1px solid #dde4ee;border-radius:12px;padding:20px}.stat strong{display:block;font-size:30px;margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.item{background:white;border:1px solid #dde4ee;border-radius:12px;overflow:hidden;padding:12px}.item img{display:block;width:100%;height:210px;object-fit:contain;background:#edf1f7}.item video{width:100%;height:210px;background:#0b1524}.item audio{width:100%}.filename{font-size:14px;overflow-wrap:anywhere;margin:12px 0 6px;line-height:1.6}.meta{font-size:14px;color:#596e87}section{margin-top:30px}section h3{font-size:20px}.files{display:grid;gap:10px}.file{background:white;padding:16px;border:1px solid #dde4ee;border-radius:10px;display:flex;justify-content:space-between;gap:16px}.empty{border:1px dashed #9dacc0;padding:20px;border-radius:10px;color:#536780;line-height:1.7}#status{line-height:1.7;min-height:28px}footer{margin:40px 0 24px;font-size:14px;color:#536780}.error{color:#a82323}@media(max-width:720px){main{margin-top:26px}header{padding:20px 24px}header b{font-size:18px}.badge{font-size:12px}h1{font-size:26px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}form{flex-direction:column}.result-head{align-items:flex-start;flex-direction:column}.file{flex-direction:column}}
</style></head>
<body><header><b>Facebook / 教学素材库</b><span class="badge">仅在本机读取</span></header><main>
<h1>输入账号，查看已有结果</h1><p class="muted">输入姓名、用户名或 Facebook 链接，查看项目中已经保存的素材。</p>
<form id="search"><label for="account" hidden>目标账号、姓名或链接</label><input id="account" aria-label="目标账号、姓名或链接" placeholder="例如 Ray Hunt 或 facebook.com/ray.hunt.127" autocomplete="off" required><button id="submit" type="submit">查看结果</button></form>
<div id="examples" class="examples" aria-label="已收录账号"></div>
<div class="notice">这是已有本地结果的查看入口，不会访问 Facebook 或启动新一轮采集。素材数量按当前文件统计；现有素材不代表身份核验或视频真伪检测结果。</div>
<p id="status" role="status" aria-live="polite">正在读取账号列表…</p><div id="results"></div>
<footer>反诈教学 · 原始素材保持不变 · 编号账号已从本次示例排除，文件仍保留。关闭页面不会停止服务，可运行项目内的“停止查看器”。</footer></main>
<script>
const $=id=>document.getElementById(id); let accounts=[]; let requestId=0;
const labels={image:'图片',video:'视频',audio:'音频',text:'文本'};
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el}
function key(value){let text=value.trim().toLowerCase().replace(/^@/,'');try{const url=new URL(text.includes('://')?text:'https://'+text);if(['facebook.com','www.facebook.com','m.facebook.com'].includes(url.hostname)){return url.searchParams.get('id') || url.pathname.replace(/^\/+|\/+$/g,'')}}catch{}return text.replace(/\/$/,'')}
function matches(account,query){return [account.name,account.slug,account.url].some(value=>key(value)===query)}
function size(bytes){return bytes>=1048576?(bytes/1048576).toFixed(1)+' MB':Math.ceil(bytes/1024)+' KB'}
async function show(account){const id=++requestId;$('results').replaceChildren();$('status').className='';$('status').textContent='正在读取 '+account.name+' 的本地文件…';$('submit').disabled=true;
try{const response=await fetch('/api/account/'+encodeURIComponent(account.slug));const data=await response.json();if(!response.ok)throw new Error(data.error);if(id!==requestId)return;
const head=element('div',undefined,'result-head');const title=element('div');title.append(element('h2',data.name),element('p',data.url,'muted'));head.append(title,element('span','已有本地结果','muted'));$('results').append(head);
const stats=element('div',undefined,'stats');for(const [kind,label] of Object.entries(labels)){const box=element('div',undefined,'stat');box.append(element('strong',String(data.files[kind].length)),element('span',label));stats.append(box)}$('results').append(stats);
for(const [kind,label] of Object.entries(labels)){const section=element('section');section.append(element('h3',label));const files=data.files[kind];if(!files.length){section.append(element('div','暂无已保存的'+label+'。未生成替代文件，也未将其他类型素材当作此类结果。','empty'))}else{const grid=element('div',undefined,kind==='text'?'files':'grid');for(const file of files){const card=element('div',undefined,kind==='text'?'file':'item');if(kind==='image'){const img=element('img');img.src=file.url;img.alt='已保存图片：'+file.name;img.loading='lazy';card.append(img)}else if(kind==='video'||kind==='audio'){const media=element(kind);media.src=file.url;media.controls=true;media.preload='metadata';card.append(media)}const link=element('a',file.name,'filename');link.href=file.url;link.target='_blank';link.rel='noopener';card.append(link,element('div',size(file.bytes),'meta'));grid.append(card)}section.append(grid)}$('results').append(section)}$('status').textContent='已读取 '+data.name+' 的现有结果。';
}catch(error){if(id===requestId){$('status').className='error';$('status').textContent=error.message||'读取失败，请重试。'}}finally{if(id===requestId)$('submit').disabled=false}}
$('search').addEventListener('submit',event=>{event.preventDefault();const query=key($('account').value);const found=accounts.find(account=>matches(account,query));if(found)show(found);else{requestId++;$('submit').disabled=false;$('results').replaceChildren();$('status').className='error';$('status').textContent='本地尚未收录这个账号。请使用下方已收录账号对应的姓名或完整链接；此入口不会自动采集新账号。'}});
fetch('/api/accounts').then(async response=>{if(!response.ok)throw new Error();return response.json()}).then(data=>{accounts=data.accounts;for(const account of accounts){const button=element('button',account.name);button.type='button';button.addEventListener('click',()=>{$('account').value=account.name;show(account)});$('examples').append(button)}$('status').textContent='已找到 '+accounts.length+' 个账号的记录，请输入账号或选择示例。'}).catch(()=>{$('status').className='error';$('status').textContent='账号列表读取失败，请确认项目文件完整并重新启动。'});
</script></body></html>
